[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "tcages"
version = "0.3.1"
authors = [
    {name = "Dave Whipp", email = "david.whipp@helsinki.fi"},
    {name = "Saska Dönges", email = "saska.donges@helsinki.fi"},
    {name = "Richard Ketcham", email = "ketcham@jsg.utexas.edu"},
]
maintainers = [
    {name = "Dave Whipp", email = "david.whipp@helsinki.fi"},
]
description = "Thermochronometer age prediction libraries used in Tc1D and Tcplotter"
keywords = ["thermochronology", "geology", "geophysics"]
readme = "README.md"
requires-python = ">=3.10.0"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy"]

[project.optional-dependencies]
lint = ["ruff"]
tests = ["pytest"]

[tool.scikit-build]
wheel.packages = ["src/tcages"]
wheel.py-api = "py3"
wheel.expand-macos-universal-tags = true
cmake.version = ">=3.18"
cmake.build-type = "Release"

[project.urls]
repository = "https://github.com/HUGG/tcages"

[tool.cibuildwheel]
test-requires = ["pytest"]
test-command = "pytest {project}/tests -v"
test-skip = "cp310-win_arm64"
# 32-bit Windows is not supported by scipy and matplotlib, which Tc1D and tcplotter need
skip = "*-win32"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# Pyflakes (F) and a subset of pycodestyle (E) errors, as used for Tc1D and tcplotter
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"
